name: Publish to PyPI

# Runs when a version tag such as v0.1.0 is pushed. PyPI Trusted Publishing (OIDC) is configured for
# repository tmailor-com/tmailor-mcp, workflow publish.yml, environment pypi: no API token is stored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          version=$(python -c "import re; print(re.search(r'\"(.+)\"', open('src/tmailor_mcp/_version.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match src/tmailor_mcp/_version.py ($version)"; exit 1
          fi
          python - "$version" <<'PY'
          import json, sys
          v = sys.argv[1]
          d = json.load(open("server.json"))
          bad = [x for x in [d["version"], d["packages"][0]["version"]] if x != v]
          if bad:
              sys.exit(f"server.json version(s) {bad} do not match {v}")
          if "mcp-name: " + d["name"] not in open("README.md").read():
              sys.exit("README.md lacks the mcp-name marker for " + d["name"])
          PY
      - run: pip install -e ".[dev]" twine
      - run: pytest -q
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/tmailor-mcp/
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    # Lists the new version in the official MCP Registry (io.github.tmailor-com/*) with GitHub OIDC: no secret.
    # The registry checks the "mcp-name:" marker in the README of the PyPI release, so it runs after publish.
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # required for mcp-publisher login github-oidc
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher (pinned)
        run: |
          curl -sSfL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher --version
      - name: Wait until PyPI serves this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/tmailor-mcp/$v/json" >/dev/null && exit 0
            sleep 10
          done
          echo "tmailor-mcp $v is not on PyPI yet"; exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
