name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q  # offline: an in-memory fake of the Open API, no key needed

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: server.json matches the package version and the README marker
        run: |
          python - <<'PY'
          import json, re, sys
          v = re.search(r'"(.+)"', open("src/tmailor_mcp/_version.py").read()).group(1)
          d = json.load(open("server.json"))
          if {d["version"], d["packages"][0]["version"]} != {v}:
              sys.exit(f"server.json versions differ from {v}")
          if "mcp-name: " + d["name"] not in open("README.md").read():
              sys.exit("README.md lacks the mcp-name marker")
          PY
      - name: the wheel installs and the command starts
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          /tmp/w/bin/tmailor-mcp --version
